name: Project tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Server and access tests
        run: dotnet test tests/MellowHouse.Tests/MellowHouse.Tests.csproj --logger "trx;LogFileName=project-tests.trx" --verbosity minimal
      - name: Browser logic tests
        run: node --test tools/static-storefront-v13.test.mjs tools/order-status-v8.test.mjs tools/chat-session-v10.test.mjs tools/form-guard-v12.test.mjs tools/browser-cart-v17.test.mjs tools/product-options-v18.test.mjs
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/MellowHouse.Tests/TestResults/*.trx
          retention-days: 7
